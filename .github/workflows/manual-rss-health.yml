name: Manual RSS health metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-rss-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline integrity and safety tests
        run: |
          python3 tools/verify_public.py
          python3 -m unittest discover -s tools/tests -v
          (cd collector && python3 -m unittest discover -s tests -v)
      - name: One attempt per official source, metadata only
        run: python3 tools/rss_health_probe.py
